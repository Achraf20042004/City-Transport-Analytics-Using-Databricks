version: "3"
services:
  nifi:
    image: apache/nifi:latest
    container_name: nifi-transportation
    ports:
      - "8443:8443"
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=change_me
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/conf
      - nifi-state:/opt/nifi/nifi-current/state
      # mount your local CSV folder here
      - ./data/trips:/mes_donnees

  minio:
    image: minio/minio
    container_name: minio-storage
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - MINIO_ROOT_USER=admin
      - MINIO_ROOT_PASSWORD=change_me
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data

volumes:
  nifi-conf:
  nifi-state:
  minio-data:
